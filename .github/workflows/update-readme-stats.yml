name: Update README stats

on:
  workflow_dispatch:
  schedule:
    - cron: "17 21 * * *" # Daily at 06:17 Asia/Seoul.

permissions: {}

concurrency:
  group: update-readme-stats
  cancel-in-progress: false

jobs:
  generate:
    # Never run with secrets on forks, pull requests, or non-default branches.
    if: >-
      github.repository == 'Loookup/Loookup' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check private stats token
        env:
          STATS_TOKEN: ${{ secrets.STATS_TOKEN }}
        run: |
          if [ -z "$STATS_TOKEN" ]; then
            echo "::error::Add the STATS_TOKEN Actions secret. See .github/README-stats.md."
            exit 1
          fi

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2
        with:
          card: stats
          options: username=Loookup
          path: profile/stats.svg
          token: ${{ secrets.STATS_TOKEN }}
          core_version: "2.2.1"
          fail_on_error: "true"

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2
        with:
          card: top-langs
          options: username=Loookup&layout=donut
          path: profile/top-langs.svg
          token: ${{ secrets.STATS_TOKEN }}
          core_version: "2.2.1"
          fail_on_error: "true"

      - name: Upload only the generated cards
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: readme-stats
          path: |
            profile/stats.svg
            profile/top-langs.svg
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    # STATS_TOKEN is never passed to this job. Push uses this repo's GITHUB_TOKEN.
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Download the generated cards
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: readme-stats
          path: profile

      - name: Switch README to generated cards
        shell: python
        run: |
          from pathlib import Path
          import xml.etree.ElementTree as ET

          replacements = {
              "https://github-readme-stats.vercel.app/api/top-langs/?username=Loookup&layout=donut": "./profile/top-langs.svg",
              "https://github-readme-stats.vercel.app/api?username=Loookup": "./profile/stats.svg",
          }
          # Switch only after both cards have been generated successfully.
          for card in replacements.values():
              if ET.parse(card).getroot().tag != "{http://www.w3.org/2000/svg}svg":
                  raise SystemExit("Invalid stats card; README was not updated.")
          readme = Path("README.md")
          content = readme.read_text()
          for original, generated in replacements.items():
              content = content.replace(original, generated)
          readme.write_text(content)

      - name: Commit only the cards and README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- README.md profile/stats.svg profile/top-langs.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update README stats"
          git push
